# Mi UNAD AI - revisión automática en los servidores de GitHub (no requiere tu PC encendido)
name: Mi UNAD AI

on:
  schedule:
    # Cada 30 minutos (en los minutos 7 y 37 para evitar la congestión del minuto 0).
    # El cron de GitHub va en hora UTC; el horario de silencio lo maneja el código en hora Colombia.
    - cron: "7,37 * * * *"
  workflow_dispatch:   # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: read       # este repositorio público ya no guarda datos: todo va al repo privado

concurrency:
  group: mi-unad-watcher   # nunca dos revisiones al mismo tiempo (evita choques en los datos)
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas (si fallan, el bot no corre)
        run: python -m unittest discover tests -q

      - name: Traer la base de datos privada
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$DATA_REPO_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" clone -q --depth 1 \
            "https://github.com/${{ github.repository_owner }}/mi-unad-ai-data.git" data_repo

      - name: Revisar agendas y avisar por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CODE: ${{ secrets.TELEGRAM_ADMIN_CODE }}
          DATA_DIR: data_repo/data
        run: python -m app.watcher

      - name: Guardar la base de datos privada
        if: always()   # también si hubo error, para no repetir lo que sí se envió
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          [ -d data_repo/data ] || exit 0
          cd data_repo
          git config user.name "mi-unad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -q -m "datos del bot"
            AUTH=$(printf 'x-access-token:%s' "$DATA_REPO_TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH"
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" pull -q --rebase --autostash
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -q
          fi
